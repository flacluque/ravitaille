spring.application.name=trail-planner
server.port=8080

# Dates et durées en ISO-8601 dans le JSON ("2026-10-23T14:30:00", "PT8H48M")
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-durations-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Les traces GPX d'ultra pèsent vite plusieurs Mo
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
