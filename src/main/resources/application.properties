spring.application.name=trail-planner
# Render (et la plupart des hébergeurs) donnent le port dans la variable PORT.
server.port=${PORT:8080}
# Derrière le proxy https de l'hébergeur : adresse et https d'origine (cookies « Secure », retour de Strava).
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=application/json,application/javascript,text/css,text/html,image/svg+xml

# Dates et durées en ISO-8601 dans le JSON ("2026-10-23T14:30:00", "PT8H48M")
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-durations-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Les traces GPX d'ultra et les roadbooks PDF (livrets avec photos) pèsent vite des dizaines de Mo
spring.servlet.multipart.max-file-size=60MB
spring.servlet.multipart.max-request-size=65MB

# Lecture automatique des roadbooks (image / PDF) par une IA : ollama, gemini, ou none pour désactiver.
# Ollama : IA locale et gratuite (https://ollama.com), puis « ollama pull qwen2.5vl:7b ».
# Gemini (en ligne) : TRAILPLANNER_EXTRACTION_PROVIDER=gemini et TRAILPLANNER_EXTRACTION_GEMINI_API_KEY=…
# (clé gratuite sur https://aistudio.google.com/apikey). Modèle : trailplanner.extraction.gemini.model.
trailplanner.extraction.provider=ollama
trailplanner.extraction.ollama.base-url=http://localhost:11434
trailplanner.extraction.ollama.model=qwen2.5vl:7b
trailplanner.extraction.ollama.timeout=5m
# Contexte du modèle (tokens) : 32k pour lire jusqu'à 4 pages de roadbook avec leur texte.
trailplanner.extraction.ollama.context-tokens=32768
# Pour voir la réponse brute du modèle quand une lecture est ratée :
# logging.level.fr.trailplanner.extract=DEBUG

# Import des activités Strava. L'identifiant et le secret viennent de l'application API créée sur
# https://www.strava.com/settings/api (domaine de rappel : localhost, ou le domaine du site en ligne).
# Ne les mets pas ici : place-les dans config/application.properties, à la racine du projet (ignoré par
# git), ou dans les variables d'environnement TRAILPLANNER_STRAVA_CLIENT_ID et TRAILPLANNER_STRAVA_CLIENT_SECRET.
# Les jetons de chaque coureur sont gardés dans un cookie chiffré de son navigateur, pas sur le serveur.
# trailplanner.strava.client-id=
# trailplanner.strava.client-secret=

# Site en ligne (variables d'environnement TRAILPLANNER_SECRET, TRAILPLANNER_ACCESS_CODE, TRAILPLANNER_FEEDBACK_URL) :
# clé qui chiffre les cookies (vide en local : créée dans ~/.trail-planner/secret.key)
# trailplanner.secret=
# code d'invitation demandé aux visiteurs (vide : site ouvert)
# trailplanner.access-code=
# lien du bouton « Donner mon avis » (formulaire, ou mailto:…)
# trailplanner.feedback-url=

# Appli mobile (Capacitor) : origines autorisées à appeler l'API (CORS), et lien qui rouvre l'appli après Strava.
# trailplanner.app-origins=capacitor://localhost,https://localhost
# trailplanner.app-scheme=ravitime
